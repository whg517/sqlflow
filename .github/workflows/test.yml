# test.yml — Unit Tests + Build
# =============================================
# Runs on PR and push to main.
# Tests + build verification. Lint is in lint.yml.

name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  test-backend:
    name: Test (Go)
    runs-on: ubuntu-latest
    # The platform store is PostgreSQL (ADR-0009); the Go test suite needs a
    # live instance. testutil connects to SQLFLOW_TEST_DSN.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sqlflow
          POSTGRES_PASSWORD: sqlflow
          POSTGRES_DB: sqlflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLFLOW_TEST_DSN: postgres://sqlflow:sqlflow@localhost:5432/sqlflow?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # pg_dump is needed by backup tests (internal/ops). The version from the
      # PostgreSQL APT repo must be >= the server major (17) to dump it.
      - name: Install PostgreSQL client (pg_dump)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Run Go tests
        run: go test -v -race -count=1 -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Print coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Run unit tests with coverage
        working-directory: web
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            web/coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Build Go binary
        run: go build -o /dev/null ./cmd/server/
